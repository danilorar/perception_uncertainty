# Author: Zhuo Ma
# 启用时复制到仓库根目录 / Copy to repository root to enable:
# .github/workflows/native-acc.yml
name: Native esmini ACC
on: [push, pull_request, workflow_dispatch]
jobs:
  simulate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: experiments/esmini-perception/simulation/acc_cpp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install cmake==3.31.6
      - run: python tools/build_native.py --jobs 2
      - if: runner.os != 'Windows'
        run: python tools/compare_native_acc.py --binary build/runner/acc_sim --output-dir results/native_acc_identity
      - if: runner.os == 'Windows'
        run: python tools/compare_native_acc.py --binary build/runner/Release/acc_sim.exe --output-dir results/native_acc_identity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulation-results-${{ matrix.os }}
          path: |
            experiments/esmini-perception/simulation/acc_cpp/results/
            experiments/esmini-perception/simulation/acc_cpp/build/*-build.log
